<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyberpunk Synthwave Runner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="hud">

    <script src="game.js"></script>

</html>
