<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Neon Pomodoro Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🕶️ Cyberpunk Pomodoro</h1>
    </header>
    <main>
        <section id="timer-section">
            <div id="timer-display">25:00</div>
            <div id="controls">
                <button id="startBtn">Start</button>
                <button id="pauseBtn" disabled>Pause</button>
                <button id="resetBtn" disabled>Reset</button>
            </div>
        </section>
        <section id="tasks-section">
            <h2>Tasks</h2>
            <form id="taskForm">
                <input type="text" id="taskInput" placeholder="New task..." autocomplete="off" required>
                <button type="submit">Add</button>
            </form>
            <ul id="taskList"></ul>
        </section>
    </main>
    <script src="timer.js" type="module"></script>
    <script src="tasks.js" type="module"></script>
</body>
</html>
