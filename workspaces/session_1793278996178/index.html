<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flappy Bird Flipboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/tone@14.8.39/build/Tone.min.js"></script>
</head>
<body>
    <canvas id="gameCanvas" width="480" height="640"></canvas>

    <div id="hud">
        <div id="scoreBoard" class="glass">
            <div>Score: <span id="currentScore">0</span></div>
            <div>Best: <span id="highScore">0</span></div>
        </div>
        <button id="restartBtn" class="glass">Restart</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
