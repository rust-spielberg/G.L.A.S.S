<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Neon Tower Defense</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="gameCanvas" width="800" height="500"></canvas>

<div id="hud">
  <div class="hud-item">Credits: $<span id="credits">500</span></div>
  <div class="hud-item">Health:
    <div id="healthBar"><div id="healthFill"></div></div>
  </div>
  <div class="hud-item">Wave: <span id="wave">1</span></div>
  <div class="turret-select">
    <button id="laserBtn" class="turretBtn">Laser</button>
    <button id="plasmaBtn" class="turretBtn">Plasma</button>
    <button id="freezeBtn" class="turretBtn">Freeze</button>
  </div>
</div>

<div id="modal" class="hidden">
  <div class="modal-content">
    <h2 id="modalTitle">Game Over</h2>
    <p>Score: <span id="finalScore">0</span></p>
    <button id="restartBtn">Next Sector</button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
